services:
  - type: web
    name: mededge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: CORS_ORIGINS
        sync: false
      - key: DAILY_BUDGET_USD
        value: "8"
      - key: ENABLE_DEV_ROUTES
        value: "false"
