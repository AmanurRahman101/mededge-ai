services:
  - type: web
    name: mededge-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_RENDER_PROXY
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: DAILY_BUDGET_USD
        value: "8"
      - key: ENABLE_DEV_ROUTES
        value: "false"
      # Judge demo logins. Leave password empty to disable the demo accounts.
      - key: DEMO_PATIENT_EMAIL
        value: demo.patient@example.com
      - key: DEMO_DOCTOR_EMAIL
        value: demo.doctor@example.com
      - key: DEMO_PASSWORD
        sync: false
      - key: PSEUDONYM_SALT
        sync: false
