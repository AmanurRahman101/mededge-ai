services:
  - type: web
    name: mededge-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_RENDER_PROXY
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: DAILY_BUDGET_USD
        value: "8"
      - key: ENABLE_DEV_ROUTES
        value: "false"
