name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mededge
          POSTGRES_PASSWORD: mededge-test
          POSTGRES_DB: mededge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mededge -d mededge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://mededge:mededge-test@127.0.0.1:5432/mededge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Lint
        run: python -m ruff check app tests
        working-directory: backend
      - name: Test
        run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
