name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Lint
        run: python -m ruff check app tests
        working-directory: backend
      - name: Test
        run: python -m pytest
        working-directory: backend
